[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sejong-ai-office"
version = "0.2.0"
description = "Local, structured Office and HWPX extraction with source evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
officeparse = "officeparse.__main__:main"

[tool.setuptools.packages.find]
include = ["officeparse*"]
